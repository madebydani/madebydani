name: Actualizar perfil

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-perfil
  cancel-in-progress: false

jobs:
  proyectos:
    name: Últimos proyectos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar la sección de proyectos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python .github/scripts/actualizar_proyectos.py

      # El historial se mantiene en un único commit: si hay cambios, se reescribe.
      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Nada que actualizar."
            exit 0
          fi
          git config user.name "madebydani"
          git config user.email "daniel.chorro.dev@gmail.com"
          git add README.md
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:main

  contribuciones:
    name: Animación de contribuciones
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribuciones.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Actualizar animación de contribuciones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
